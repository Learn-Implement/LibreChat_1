name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Debug PAT presence
        run: |
          if [ -n "$PAT" ]; then
            echo "PAT is set (length: ${#PAT})"
          else
            echo "PAT is NOT set"
          fi
        env:
          PAT: ${{ secrets.PAT }}

      - name: Add upstream and merge
        run: |
          git remote add upstream https://github.com/danny-avila/LibreChat.git
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit

      - name: Push changes to fork
        run: |
          git push https://Learn-Implement:${PAT}@github.com/Learn-Implement/LibreChat_1.git main
        env:
          PAT: ${{ secrets.PAT }}

      - name: Create issue on conflict
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Merge conflict during upstream sync',
              body: 'The scheduled sync with `danny-avila/LibreChat` hit a merge conflict (likely in `librechat.yaml`). Please resolve it manually.\n\n[View failed run](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')'
            });
