services:
  meilisearch:
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    image: ghcr.io/danny-avila/librechat:v0.8.8-rc4
    volumes:
      - ./librechat.yaml:/app/librechat.yaml

    environment:
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CREDS_KEY: ${CREDS_KEY}
      CREDS_IV: ${CREDS_IV}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      QWEN_API_KEY: ${QWEN_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      SERPER_API_KEY: ${SERPER_API_KEY}
      DOMAIN_CLIENT: ${DOMAIN_CLIENT}
      DOMAIN_SERVER: ${DOMAIN_SERVER}
      HOST: ${HOST}
      PORT: ${PORT}
      OPENAI_EXTRA_BODY: ${OPENAI_EXTRA_BODY}
      CONFIG_PATH: ${CONFIG_PATH}
      SEARCH: ${SEARCH}
      MEILI_HOST: ${MEILI_HOST}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      HTTP_REQUEST_TIMEOUT_MS: ${HTTP_REQUEST_TIMEOUT_MS}
      USE_REDIS: ${USE_REDIS}
      REDIS_URI: ${REDIS_URI}
      USE_REDIS_STREAMS: ${USE_REDIS_STREAMS}
      DEBUG_LOGS: "true"

  admin-panel:
    environment:
      SESSION_SECRET: ${ADMIN_PANEL_SESSION_SECRET}

  rag_api:
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest
    environment:
      RAG_OPENAI_API_KEY: ${RAG_OPENAI_API_KEY}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OCR_API_KEY: ${OCR_API_KEY}
      OCR_PROVIDER: ${OCR_PROVIDER}

volumes:
  redis_data:
