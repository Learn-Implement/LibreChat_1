version: 1.3.13

memory:
  enabled: false

webSearch:
  searchProvider: "tavily"
  serperApiKey: "${SERPER_API_KEY}"
  tavilyApiKey: "${TAVILY_API_KEY}"

fileConfig:
  ocr:
    provider: "mistral_ocr"
    supportedMimeTypes:
      - "image/png"
      - "image/jpeg"
      - "application/pdf"
  endpoints:
    default:
      fileLimit: 10
      fileSizeLimit: 20
    agents:
      fileLimit: 10
      fileSizeLimit: 25
      supportedMimeTypes:
        - "application/pdf"
        - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        - "text/plain"
        - "text/markdown"
        - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        - "application/vnd.openxmlformats-officedocument.presentationml.presentation"
   
endpoints:
  custom:
    - name: "DeepSeek"
      apiKey: "${DEEPSEEK_API_KEY}"   # Read from environment variable
      baseURL: "https://api.deepseek.com/v1"
      models:
        default:
          - deepseek-v4-pro
          - deepseek-v4-flash
        fetch: false
      titleConvo: true
      titleModel: "deepseek-v4-pro"
      modelDisplayLabel: "DeepSeek V4"

    - name: "Gemini"
      apiKey: "${GEMINI_API_KEY}"
      baseURL: "https://generativelanguage.googleapis.com/v1beta"
      models:
        default:
          - gemini-3.6-flash
          - gemini-3.5-flash
          - gemini-3.5-flash-lite
          - gemini-2.5-pro
        fetch: false
      titleConvo: true
      titleModel: "gemini-3.6-flash"
      modelDisplayLabel: "Gemini"
      safetySettings:
        - category: "HARM_CATEGORY_HARASSMENT"
          threshold: "BLOCK_NONE"
        - category: "HARM_CATEGORY_HATE_SPEECH"
          threshold: "BLOCK_NONE"
        - category: "HARM_CATEGORY_SEXUALLY_EXPLICIT"
          threshold: "BLOCK_NONE"
        - category: "HARM_CATEGORY_DANGEROUS_CONTENT"
          threshold: "BLOCK_NONE"

    - name: "Qwen"
      apiKey: "${QWEN_API_KEY}"
      baseURL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      models:
        default:
          - qwen-max
          - qwen-plus
          - qwen-turbo
          - qwen-long
          - qwen-omni-turbo
        fetch: false
      titleConvo: true
      titleModel: "qwen-max"          # <-- set as default Qwen model
      modelDisplayLabel: "Qwen"
